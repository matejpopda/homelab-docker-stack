services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "192.168.10.5:3001:3001"
    volumes:
      - /opt/appdata/uptime-kuma:/app/data

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8090
    ports:
      - 8090:8090
    volumes:
      - /opt/appdata/beszel/hub:/beszel_data
      - /opt/appdata/beszel/socket:/beszel_socket
    # healthcheck:
    #   test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
    #   interval: 120s
    #   start_period: 10s
    #   timeout: 5s

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/appdata/beszel/agent:/var/lib/beszel-agent
      - /opt/appdata/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: "${BESZEL_TOKEN}"
      KEY: "${BESZEL_KEY}"
    # healthcheck:
    #   test: ['CMD', '/agent', 'health']
    #   interval: 120s




  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    ports:
      - "192.168.10.5:8091:8080"
    cap_add:
      - SYS_RAWIO
    privileged: true
    volumes:
      - /run/udev:/run/udev:ro
      - /opt/appdata/scrutiny/config:/opt/scrutiny/config
      - /opt/appdata/scrutiny/influxdb:/opt/scrutiny/influxdb




  whatsupdocker:
    image: getwud/wud:latest
    container_name: whatsupdocker
    restart: unless-stopped
    ports:
      - "192.168.10.5:3002:3000"
    environment:
      WUD_AUTH_ADMIN_USER: root
      WUD_AUTH_ADMIN_PASSWORD: "${WUD_ADMIN_PASSWORD}"  
      WUD_TRIGGER_DOCKER_LOCAL_AUTO: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/appdata/whatsupdocker:/store



  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    ports:
      - "192.168.10.5:3003:80"
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      APP_KEY: "%{SPEEDTEST_APP_KEY}"
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: "0 * * * *"
      DISPLAY_TIMEZONE: "${TZ}"
    volumes:
      - /opt/appdata/speedtest-tracker:/config



  healthchecks:
    image: healthchecks/healthchecks:latest
    container_name: healthchecks
    restart: unless-stopped
    ports:
      - "192.168.10.5:8000:8000"
    environment:
      DB: sqlite
      DB_NAME: /data/hc.sqlite
      DEBUG: "False"
      SECRET_KEY: "${HEALTHCHECKS_SECRET_KEY}"
      SITE_ROOT: "http://192.168.10.5:8000"
      DEFAULT_FROM_EMAIL: "healthchecks@home.local"
    volumes:
      - /opt/appdata/healthchecks:/data
