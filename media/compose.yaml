
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: ${UMASK}
    volumes:
      - /opt/appdata/sonarr:/config
      - /srv/media:/data
    ports:
      - "8989:8989"
    networks:
      - media
      - homepage

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: ${UMASK}
    volumes:
      - /opt/appdata/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - media
      - homepage


  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: ${UMASK}
    volumes:
      - /opt/appdata/radarr:/config
      - /srv/media:/data
    ports:
      - "7878:7878"
    networks:
      - media
      - homepage


  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - media
      - homepage

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096/tcp"
    environment:
      TZ: ${TZ}
    volumes:
      - /opt/appdata/jellyfin/config:/config
      - /opt/appdata/jellyfin/cache:/cache
      - /srv/media:/media:ro
    networks:
      - media
      - homepage


  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "5055:5055"
    volumes:
      - /opt/appdata/seerr:/app/config
    networks:
      - media
      - homepage


  tdarr:
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:3.02.00
    restart: unless-stopped
    ports:
      - 8265:8265 # webUI port
      - 8266:8266 # server port
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=TDarrServerNode
      - auth=true
      - apiKey= # API key for the internal Node
      - openBrowser=true
      - enableDockerAutoUpdater=false
      - maxLogSizeMB=10
      - cronPluginUpdate=
      #- NVIDIA_DRIVER_CAPABILITIES=all
      #- NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /opt/appdata/tdarr/server:/app/server
      - /opt/appdata/tdarr/configs:/app/configs
      - /opt/appdata/tdarr/logs:/app/logs
      - /srv/media:/media
      - /tmp/transcode_cache:/temp
    networks:
      - media
      - homepage




  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /opt/appdata/bazarr/config:/config
      - /srv/media:/data 
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - media
      - homepage

networks:
  media:
    name: media
  homepage:
    name: homepage