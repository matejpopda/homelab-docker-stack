services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: ${UMASK}
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - /opt/appdata/qbittorrent:/config
      - /srv/media:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - media

networks:
  media:
    external: true
    name: media
