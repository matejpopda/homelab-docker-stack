
services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft-evolution2
    restart: unless-stopped
    tty: true
    stdin_open: true

    ports:
      - "25565:25565"
      - "24454:24454/udp"

    environment:
      EULA: "TRUE"
      TYPE: "FTBA"
      FTB_MODPACK_ID: "135"
      FTB_MODPACK_VERSION_ID: "100565"
      MEMORY: "8G"
      TZ: "Europe/Prague"
      SERVER_NAME: "Feed The Beast Evo 2"
      DIFFICULTY: 3
      

    volumes:
      - /opt/appdata/minecraft-evolution2:/data
